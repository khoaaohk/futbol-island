<!--
Mental toughness prototype, 60 seconds. Supplied transparent character and mural
sheets are rigged as offline sprites; the field contact sheet contributes only
opaque interiors because its checkerboard is baked in. Knewave is embedded for
brush lettering. Twelve distinct lessons, layered parallax and concept-led
morphs (tear/ripple, breath, eye blink, bursts) at 24 unique samples/second.
Only the baked movie and poster are loaded by the application.
-->
