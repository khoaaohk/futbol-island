ABSTRACT MENTAL TOUGHNESS — original story built on actual upstream core.js.
30 seconds, 12 drawn fps / 24 output, 720 square. Football is the visual anchor.
Ink and halftone textures, layered torn paper, angular and circular shapes.
Every 2.5 seconds: miss / pressure / tangled thought / broader memory /
exhale / reset / attention / new angle / gentle touch / connection / tools / sign-off.
No portraits, bodies, boots, or literal field. Captions retain Luna's story.
Shape contraction, spreading rings and reconnecting lines explain the emotions.
Only reset story is being prototyped; other stories remain unchanged.
-->
