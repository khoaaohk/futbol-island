# Futbol Island media worker (Nov 3 2026): serves the /learn videos and stills from the R2 bucket `futbol-media` with Range support
# (video seeking), long-lived caching and CORS for futbolisland.app. No secrets. Deploy: `cd multiplayer/media && npx wrangler deploy`.
# Upload: `npx wrangler r2 object put futbol-media/<path> --file <file> --content-type <type> --remote`.
name = "futbol-media"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "futbol-media"
