# Futbol Island party relay (Phase 0: written, not deployed). No secrets.
# MP_ALLOWED_ORIGINS: comma-separated exact origins (one `*` per entry = one label chunk), e.g. add the team's preview pattern.
# MP_DEV=1 only for local `wrangler dev` (allows localhost and a missing Origin).
name = "futbol-party-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
MP_ALLOWED_ORIGINS = "https://futbolisland.app,https://www.futbolisland.app"

[[durable_objects.bindings]]
name = "PARTY"
class_name = "PartyRoom"

# Analytics (Phase B): daily aggregate relay counters live in one singleton RelayStats object. Set the secret with
# `wrangler secret put STATS_TOKEN` (>= 16 random chars; the Next admin route sends it as a bearer token). Not run yet.
[[durable_objects.bindings]]
name = "STATS"
class_name = "RelayStats"

[[migrations]]
tag = "v1"
# SQLite-backed Durable Object. Chosen when the account was on the Workers Free plan (SQLite was the only DO kind it allowed);
# the owner is now on Workers Paid ($5/month, Oct 22 2026). SQLite is still the recommended DO backend, so nothing changes here,
# and a class's storage backend cannot be switched after its first migration anyway.
new_sqlite_classes = ["PartyRoom"]

# Phase B: adds the RelayStats object (daily counters only). A NEW tag; v1 above stays exactly as deployed.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RelayStats"]

# Relay v2.0 (public worlds, Nov 11 2026; docs/multiplayer/WORLD-HANDOFF.md): the WorldLobby singleton (fill-first shard assignment,
# the owner's kill switch, quarantine holds in memory). World rooms themselves reuse the PARTY class (named pub-1, pub-2...), so v3
# adds one class only. Public play stays CLOSED until `wrangler secret put CONTROL_TOKEN` (>= 16 random chars) AND a
# POST /control {"public":true}. Not deployed yet.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "WorldLobby"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WorldLobby"]

# Workers Rate Limiting bindings (shared across isolates; the code falls back to in-isolate buckets without them).
# namespace_id: any integer unique within the account. Periods may only be 10 or 60 seconds.
# WORLD_RL: GET /world and /world/:shard/ws, per daily IP hash (keys "l:<hash>" and "s:<hash>"). JOIN_RL: party lookups / sockets.
[[ratelimits]]
name = "WORLD_RL"
namespace_id = "7301"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "JOIN_RL"
namespace_id = "7302"
simple = { limit = 10, period = 60 }
