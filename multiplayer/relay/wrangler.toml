# Futbol Island party relay (Phase 0: written, not deployed). No secrets.
# MP_ALLOWED_ORIGINS: comma-separated exact origins (one `*` per entry = one label chunk), e.g. add the team's preview pattern.
# MP_DEV=1 only for local `wrangler dev` (allows localhost and a missing Origin).
name = "futbol-party-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
MP_ALLOWED_ORIGINS = "https://futbolisland.app,https://www.futbolisland.app"

[[durable_objects.bindings]]
name = "PARTY"
class_name = "PartyRoom"

[[migrations]]
tag = "v1"
# SQLite-backed Durable Object. Chosen when the account was on the Workers Free plan (SQLite was the only DO kind it allowed);
# the owner is now on Workers Paid ($5/month, Oct 22 2026). SQLite is still the recommended DO backend, so nothing changes here,
# and a class's storage backend cannot be switched after its first migration anyway.
new_sqlite_classes = ["PartyRoom"]
